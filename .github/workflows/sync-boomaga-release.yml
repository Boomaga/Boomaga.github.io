name: Sync Boomaga release notes

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  sync-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate release post from Boomaga GitHub release
        run: python3 scripts/sync_boomaga_releases.py

      - name: Commit generated release notes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/_posts _config.yml

          if git diff --cached --quiet; then
            echo "No release notes changes to commit."
            exit 0
          fi

          git commit -m "Add Boomaga GitHub release notes"
          git push
